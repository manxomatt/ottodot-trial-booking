services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ottodot
      POSTGRES_PASSWORD: ottodot
      POSTGRES_DB: ottodot
    ports:
      # 5433 on the host, so this never collides with a Postgres you already run.
      - '5433:5432'
    volumes:
      - ./db/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ottodot -d ottodot']
      interval: 2s
      timeout: 3s
      retries: 20
